name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run unit tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests
      - name: Check shell scripts parse
        run: |
          for script in build-image.sh tools/*.sh image/stage-web-display/01-install/00-run.sh; do
            bash -n "${script}"
          done

  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        working-directory: ui
        run: npm ci
      - name: Typecheck and test
        working-directory: ui
        run: |
          npm run typecheck
          npm test
      - name: Check the committed bundle is up to date
        working-directory: ui
        run: |
          npm run build
          git diff --exit-code --stat -- ../src/webdisplay/static
          test -z "$(git status --porcelain -- ../src/webdisplay/static)"
