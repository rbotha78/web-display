name: Build image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      variant:
        description: Image variant
        type: choice
        options: [development, release]
        default: development
      ssh_public_key:
        description: SSH public key for the webdebug account (development variant only)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write # upload release assets
      id-token: write # build provenance attestation
      attestations: write
    env:
      VARIANT: ${{ github.event_name == 'release' && 'release' || inputs.variant }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check the release tag matches the firmware version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(sed -n 's/^WEB_DISPLAY_VERSION=//p' image/stage-web-display/01-install/files/web-display-release)"
          if [ "${TAG#v}" != "${version}" ]; then
            echo "::error::Release tag ${TAG} does not match firmware version ${version}"
            exit 1
          fi

      - name: Run unit tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Install emulation support for pi-gen
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-user-static binfmt-support

      - name: Write the debug SSH key (development variant)
        if: env.VARIANT == 'development'
        env:
          KEY: ${{ inputs.ssh_public_key }}
        run: |
          if ! printf '%s\n' "${KEY}" | ssh-keygen -l -f /dev/stdin >/dev/null 2>&1; then
            echo "::error::Development builds need a valid SSH public key in ssh_public_key"
            exit 1
          fi
          printf '%s\n' "${KEY}" > "${RUNNER_TEMP}/debug_key.pub"
          echo "DEBUG_SSH_PUBLIC_KEY=${RUNNER_TEMP}/debug_key.pub" >> "${GITHUB_ENV}"

      - name: Build the image
        env:
          FRESH: "1"
          DEPLOY_COMPRESSION: xz
        run: |
          # One retry: pi-gen downloads packages from mirrors that are occasionally unreachable.
          ./build-image.sh || { echo "::warning::Build failed; retrying once"; ./build-image.sh; }

      - name: Checksum the image
        working-directory: deploy
        run: |
          ls -l
          sha256sum *.img.xz | tee SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: deploy/*.img.xz

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-display-${{ env.VARIANT }}-image
          path: |
            deploy/*.img.xz
            deploy/SHA256SUMS
          retention-days: 14
          compression-level: 0

      - name: Attach the image to the release and mark it pre-release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "${TAG}" deploy/*.img.xz deploy/SHA256SUMS --clobber
          # Remove this once a release image has been boot-tested on a device.
          gh release edit "${TAG}" --prerelease
