[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "web-display"
version = "0.5.9"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
webdisplay = ["static/**/*"]
webdisplay_manager = ["static/**/*"]

[project.scripts]
webdisplay-manager = "webdisplay_manager.server:main"
