[platformio]
default_envs = cyd

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
upload_speed = 115200
lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  bblanchon/ArduinoJson@^7.4.0
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCYD_VERSION=\"0.2.16\"

[env:cyd-dev]
extends = env:cyd
build_flags =
  ${env:cyd.build_flags}
  -DCYD_ALLOW_INSECURE_HTTP

